name: API and mobile tests
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run API tests
        run: npm run test:api
 
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/api
          if-no-files-found: warn
          retention-days: 14
 
  mobile-tests:
    name: Android mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
 
      - name: Install dependencies
        run: npm ci
 
      - name: Download mobile app
        run: npm run setup:apps
 
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
 
      - name: Run Android tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: npm run test:android
 
      - name: Upload mobile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-test-report
          path: reports/mobile/android
          if-no-files-found: warn
          retention-days: 14